<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Dark Black Crude Oil Barrel 1 Gradient (Big Barrel) -->
    <linearGradient id="blackBarrelGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="22%" stop-color="#27272A" />
      <stop offset="55%" stop-color="#3F3F46" />
      <stop offset="82%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#050506" />
    </linearGradient>

    <linearGradient id="blackRimGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="50%" stop-color="#71717A" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Dark Charcoal Black Barrel 2 Gradient (Small Barrel) -->
    <linearGradient id="blackBarrelGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050507" />
      <stop offset="25%" stop-color="#1F1F23" />
      <stop offset="60%" stop-color="#383840" />
      <stop offset="85%" stop-color="#151518" />
      <stop offset="100%" stop-color="#030304" />
    </linearGradient>

    <linearGradient id="blackRimGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#151518" />
      <stop offset="50%" stop-color="#52525B" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Solid Gold Oil Drop Gradient -->
    <linearGradient id="goldDropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="35%" stop-color="#F0A500" />
      <stop offset="80%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8C6510" />
    </linearGradient>

    <!-- Crisp Drop Shadow Filter (No Glow) -->
    <filter id="barrelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#barrelShadow)">
    <!-- ================= SMALL BLACK BARREL (RIGHT) ================= -->
    <g id="small-black-barrel">
      <!-- Body Base -->
      <rect x="114" y="70" width="58" height="85" rx="3" fill="url(#blackBarrelGrad2)" stroke="#27272A" stroke-width="0.5" />
      
      <!-- Bottom Rim -->
      <ellipse cx="143" cy="155" rx="29" ry="6.5" fill="url(#blackRimGrad2)" />
      <ellipse cx="143" cy="155" rx="29" ry="6.5" fill="none" stroke="#09090B" stroke-width="1" />

      <!-- Horizontal Ridges / Ribs -->
      <path d="M 114 96 C 120 100, 166 100, 172 96" fill="none" stroke="url(#blackRimGrad2)" stroke-width="3" opacity="0.9" />
      <path d="M 114 126 C 120 130, 166 130, 172 126" fill="none" stroke="url(#blackRimGrad2)" stroke-width="3" opacity="0.9" />

      <!-- Top Cap / Rim -->
      <ellipse cx="143" cy="70" rx="29" ry="6.5" fill="url(#blackRimGrad2)" />
      <ellipse cx="143" cy="70" rx="26" ry="5.5" fill="#09090B" opacity="0.85" />
      <!-- Cap details -->
      <circle cx="134" cy="69" r="3" fill="url(#blackRimGrad2)" stroke="#050507" stroke-width="0.75" />

      <!-- Solid Gold Oil Drop Logo (Small Barrel Center) -->
      <path d="M 143 102 C 143 102 133 115 133 120 A 10 10 0 0 0 153 120 C 153 115 143 102 143 102 Z"
            fill="url(#goldDropGrad)" stroke="#7A5112" stroke-width="0.75" />
    </g>

    <!-- ================= BIG BLACK BARREL (LEFT FOREGROUND) ================= -->
    <g id="big-black-barrel">
      <!-- Body Base -->
      <rect x="30" y="50" width="82" height="118" rx="4" fill="url(#blackBarrelGrad1)" stroke="#3F3F46" stroke-width="0.75" />

      <!-- Bottom Rim -->
      <ellipse cx="71" cy="168" rx="41" ry="9" fill="url(#blackRimGrad1)" />
      <ellipse cx="71" cy="168" rx="41" ry="9" fill="none" stroke="#09090B" stroke-width="1.2" />

      <!-- Horizontal Ridges / Ribs -->
      <path d="M 30 86 C 40 92, 102 92, 112 86" fill="none" stroke="url(#blackRimGrad1)" stroke-width="4.5" />
      <path d="M 30 132 C 40 138, 102 138, 112 132" fill="none" stroke="url(#blackRimGrad1)" stroke-width="4.5" />

      <!-- Top Cap / Rim -->
      <ellipse cx="71" cy="50" rx="41" ry="9" fill="url(#blackRimGrad1)" />
      <ellipse cx="71" cy="50" rx="37" ry="7.5" fill="#09090B" opacity="0.9" />
      <!-- Bung / Cap details -->
      <circle cx="58" cy="48" r="4.5" fill="url(#blackRimGrad1)" stroke="#050506" stroke-width="1" />

      <!-- Solid Gold Oil Drop Logo (Big Barrel Center) -->
      <path d="M 71 95 C 71 95 57 112 57 120 A 14 14 0 0 0 85 120 C 85 112 71 95 71 95 Z"
            fill="url(#goldDropGrad)" stroke="#7A5112" stroke-width="1" />
    </g>
  </g>
</svg>
